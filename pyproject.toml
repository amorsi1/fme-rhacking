[project]
name = "FME-rHacking"
version = "0.1.0"
description = "FME project investigating reward hacking in post-training"
readme = "README.md"
# Capped at <3.14 by verifiers 0.1.9.post3.
requires-python = ">=3.12,<3.14"
dependencies = [
    "datasets>=4.5.0",
    # Pinned, not a floor. The top-level Environment/SingleTurnEnv/Rubric exports
    # that src/countdown_code uses were removed in verifiers 0.3.1, so 0.4.x fails
    # at import; 0.3.0 is the newest that works. This is the version upstream's own
    # uv.lock recorded, which keeps results comparable to the paper.
    # Do not relax without checking those exports still exist.
    "verifiers==0.1.9.post3",
    # Linux-only: vllm publishes manylinux wheels exclusively, so an unmarked
    # dependency makes the project unresolvable on macOS. The marker keeps one
    # cross-platform lockfile -- installed on the Linux/CUDA box where rollouts
    # run, skipped on laptops. Pinned to upstream's locked version: an open bound
    # floats to 0.33.x and drags transformers to 5.x, far past what this targets.
    # (verifiers constrains vllm too, but only under its unused `rl` extra.)
    "vllm==0.13.0; sys_platform == 'linux'",
    # datagen/
    "tqdm>=4.66.0",
    "pandas>=2.0.0",
    "pyarrow>=15.0.0",
    # Floor required because pyarrow >=21 needs numpy 2.x at runtime but does
    # not declare it. Without this bound nothing pushes numpy upwards and the
    # resolver settles on 1.26.4, making `import pyarrow` fail with
    # "pyarrow requires NumPy 2.0 or newer".
    "numpy>=2.0",
    # Training run logging, used by the configs/ launch scripts.
    "wandb>=0.31.0",
]

[project.optional-dependencies]
# GPU training only. Installs verl directly from the pinned upstream commit so
# the vendor clone is not needed just for training. Run: uv sync --extra gpu
# Note: verl is not on PyPI; uv resolves it from the git source below.
# If resolution fails due to a torch/transformers version conflict, add
# overrides to [tool.uv.override-dependencies] to pin the conflicting packages.
gpu = ["verl; sys_platform == 'linux'"]

[dependency-groups]
# Test-only. `uv sync` installs these by default; `uv sync --no-dev` skips them.
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# datagen/ scripts use flat imports (`import rewards`, `from paths import ...`),
# so the directory itself has to be importable rather than the package above it.
pythonpath = ["datagen"]
# The two markers below cover the full 75 MB traces blob, which is neither
# present nor affordable by default. Run them explicitly:
#   uv run pytest -m slow        # validate an already-cached traces file
#   uv run pytest -m network     # re-download from upstream and check the pin
addopts = ["-m", "not network and not slow", "--strict-markers"]
markers = [
    "network: hits raw.githubusercontent.com; downloads 75 MB",
    "slow: reads or hashes the full cached traces file",
]

[tool.uv]
# verl 0.7.0.dev0 declares `numpy<2.0.0`, a stale pin that conflicts with
# pyarrow >=21 (pulled in by datasets >=5), which needs numpy 2.x at runtime.
# Without this override the resolver has to satisfy verl, settles on numpy
# 1.26.4 for every platform, and `import pyarrow` then fails on the laptop with
# "pyarrow requires NumPy 2.0 or newer" -- breaking all of datagen/. The
# surrounding stack (torch 2.6+, vllm 0.13, transformers 4.x) is numpy-2 clean,
# so overriding verl's cap is narrower than pinning datasets and pyarrow back
# to their numpy-1 era releases.
override-dependencies = ["numpy>=2.0"]

[tool.uv.sources]
# verl lives in a subdirectory of the upstream Countdown-Code repo. Pinned to
# the same commit our vendored copies came from (170ee81) to keep the verl
# version consistent with the rest of the codebase.
verl = { git = "https://github.com/zohaib-khan5040/Countdown-Code", rev = "170ee8139cd836d6ab7b7b3a70c2063906363db0", subdirectory = "verl/verl" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# `countdown_code` keeps its upstream module name deliberately: verifiers resolves
# an environment id by importing that name directly -- load_environment("countdown-code")
# becomes importlib.import_module("countdown_code") -- so renaming breaks the lookup.
packages = ["src/countdown_code", "src/rHacking"]
